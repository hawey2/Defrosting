<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820">
<rect width="1500" height="820" fill="#f7f4ee"/>
<text x="60" y="90" font-family="Georgia,serif" font-size="42" fill="#1c2530">AI không đứng một mình: bốn lớp của đổi mới</text>
<text x="60" y="132" font-family="sans-serif" font-size="21" fill="#76808a">Lớp dưới vững thì lớp trên mới bền</text>
<path d="M380 180h740l40 110h-820z" fill="#f6e2d6" stroke="#1c2530" stroke-width="2"/><text x="750" y="232" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#1c2530">Con người & quy trình</text><text x="750" y="268" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4a5663">đào tạo, trách nhiệm, đánh giá lâm sàng</text><path d="M310 310h880l40 110h-960z" fill="#f3ead7" stroke="#1c2530" stroke-width="2"/><text x="750" y="362" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#1c2530">Ứng dụng AI</text><text x="750" y="398" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4a5663">hỗ trợ chẩn đoán, dự báo, vận hành</text><path d="M240 440h1020l40 110h-1100z" fill="#e7efe9" stroke="#1c2530" stroke-width="2"/><text x="750" y="492" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#1c2530">Liên thông dữ liệu</text><text x="750" y="528" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4a5663">chuẩn HL7 FHIR, mã hoá ICD/LOINC, định danh</text><path d="M170 570h1160l40 110h-1240z" fill="#dbe9f2" stroke="#1c2530" stroke-width="2"/><text x="750" y="622" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#1c2530">Hạ tầng số</text><text x="750" y="658" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4a5663">bệnh án điện tử, PACS, LIS, kết nối, bảo mật</text>
<path d="M1260 700 V220" stroke="#c4643a" stroke-width="4" marker-end="url(#ar)"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4643a"/></marker></defs>
<text x="1290" y="460" font-family="sans-serif" font-size="20" fill="#c4643a" transform="rotate(-90 1290 460)" text-anchor="middle">giá trị cho người bệnh</text>
</svg>
