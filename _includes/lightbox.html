<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Xem ảnh phóng to" hidden>
  <div class="lightbox-stage">
    <img class="lightbox-img" alt="">
  </div>
  <div class="lightbox-bar">
    <p class="lightbox-caption"></p>
    <div class="lightbox-actions">
      <button type="button" data-lb="prev" aria-label="Ảnh trước">←</button>
      <button type="button" data-lb="zoom" aria-label="Phóng to / thu nhỏ">⤢</button>
      <a data-lb="open" target="_blank" rel="noopener" aria-label="Mở ảnh gốc ở tab mới">↗</a>
      <button type="button" data-lb="next" aria-label="Ảnh sau">→</button>
      <button type="button" data-lb="close" aria-label="Đóng">✕</button>
    </div>
  </div>
</div>
