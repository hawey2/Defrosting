{%- assign p = include.post -%}
<article class="post-card">
  <a class="post-card-link" href="{{ p.url | relative_url }}">
    {%- if p.cover -%}
    <div class="post-card-cover"><img src="{{ p.cover | relative_url }}" alt="" loading="lazy" decoding="async"></div>
    {%- endif -%}
    <div class="post-card-body">
      <p class="meta"><time datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: '%d.%m.%Y' }}</time>
        {%- if p.tags.size > 0 %} · {{ p.tags | first }}{% endif %}</p>
      <h3>{{ p.title }}</h3>
      <p class="post-card-excerpt">{{ p.description | default: p.excerpt | strip_html | truncatewords: 32 }}</p>
    </div>
  </a>
</article>
